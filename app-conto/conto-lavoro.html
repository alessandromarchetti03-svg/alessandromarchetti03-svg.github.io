function genDocNum(nome,dataISO){

}

/* ════════════════════════════
   CALCOLI
════════════════════════════ */
function calcola(doc){
  const totM=doc.righeM.reduce((s,r)=>{
    const t=(Number(r.ore)||0)*(Number(r.prezzoOra)||0);
    return s+t;
  },0);
  const totT=doc.righeT.reduce((s,r)=>{
    const t=(Number(r.qta)||0)*(Number(r.prezzoUnit)||0);
    return s+t;
  },0);
  const sub=totM+totT;
  const sv=Number(doc.scontoVal)||0;
  const sAmt=doc.scontoTipo==="pct"?sub*sv/100:Math.min(sv,sub);
  const imp=sub-sAmt;
  const ip=Number(doc.ivaPerc)||22;
  const iAmt=doc.ivaOn?imp*ip/100:0;
  const tot=imp+iAmt;
  return{totM,totT,sub,sAmt,imp,iAmt,tot,ip,sv};
}

</style></head><body><div class="page">

${d.descLavoro?`

    <td class="grey r" style="font-size:10px;width:18%;">Totale</td>
  </tr>
  ${righeT.map(r=>`

    <td class="r grey">${r.qta||0}</td>
    <td class="grey">${r.unita}</td>

</tbody></table>
<div class="subtot">Totale materiali: <strong>${fP(c.totT)}</strong></div>

<div class="riepi">
  <div class="rr"><span class="rl">⚡ Manodopera</span><span class="rv">${fP(c.totM)}</span></div>
  <div class="rr"><span class="rl">◆ Materiali</span><span class="rv">${fP(c.totT)}</span></div>
  <div class="rr"><span class="rl">Subtotale</span><span class="rv">${fP(c.sub)}</span></div>
  ${c.sAmt>0?`<div class="rr"><span class="rl">Sconto${d.scontoTipo==="pct"?" ("+c.sv+"%)":""}</span><span class="rv" style="color:#c00;">− ${fP(c.sAmt)}</span></div>`:""}
  ${c.sAmt>0||d.ivaOn?`<div class="rr"><span class="rl">Imponibile</span><span class="rv">${fP(c.imp)}</span></div>`:""}
  ${d.ivaOn?`<div class="rr"><span class="rl">IVA (${c.ip}%)</span><span class="rv">${fP(c.iAmt)}</span></div>`:""}
</div>

<div class="tot-bar">

</div>

${d.noteLavoro?`
<div class="sec sec-blue">Note</div>
<div style="font-size:12px;color:#555;white-space:pre-wrap;margin-bottom:16px;line-height:1.65;">${d.noteLavoro}</div>`:""}

<div class="approv">Il lavoro è stato eseguito secondo le specifiche ed approvato dal cliente.</div>

<div class="disclaimer">

<div class="firme">

</div>
</div>
<script>window.onload=function(){setTimeout(function(){window.print();},400);};<\/script>
</body></html>`;

    const w=window.open("","_blank","width=800,height=900");
    if(w){w.document.write(html);w.document.close();}
    else alert("Abilita i popup per esportare il PDF.");
  }

  /* ════════ RENDER ════════ */
  return(
    <div style={{fontFamily:"'Inter',sans-serif",minHeight:"100vh",background:C.black}}>
      <style>{GLOBAL_CSS}</style>

      {/* NAV */}
      <nav style={{position:"sticky",top:0,zIndex:100,background:"rgba(10,10,10,0.95)",backdropFilter:"blur(16px)",borderBottom:"1px solid rgba(255,255,255,0.06)"}}>
        <div style={{maxWidth:680,margin:"0 auto",padding:"0 16px",display:"flex",justifyContent:"space-between",alignItems:"center",height:58}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <LogoSVG size={32}/>
            <div>
              <div style={{fontWeight:800,fontSize:15,letterSpacing:"-0.02em",color:C.pure,lineHeight:1}}>
                Emme<span style={{color:C.blue}}>2000</span>
              </div>
              <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:9,letterSpacing:"0.14em",textTransform:"uppercase",color:C.mid}}>Conto Lavoro</div>
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{display:"flex",alignItems:"center",fontFamily:"'IBM Plex Mono',monospace",fontSize:10,color:C.mid,cursor:"pointer"}} onClick={loadAll}>
              <span className={`sync-dot ${syncStatus==="ok"?"sync-ok":syncStatus==="err"?"sync-err":"sync-loading"}`}></span>
              <span style={{display:window.innerWidth>420?"inline":"none"}}>{syncMsg}</span>
            </div>
            <NBtn active={view==="form"} onClick={nuovoDoc}>+ Nuovo</NBtn>
            <NBtn active={view==="storico"} onClick={()=>{loadAll();setView("storico");}}>Archivio</NBtn>
            <NBtn active={view==="impostazioni"} onClick={()=>setView("impostazioni")}>Azienda</NBtn>
          </div>
        </div>
      </nav>

      <div style={{maxWidth:680,margin:"0 auto",padding:"24px 16px 80px"}}>

        {/* ══ FORM ══ */}
        {view==="form"&&(
          <div className="card">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <div>
                <div className="sec-label">{editingId?"Modifica conto":"Nuovo conto lavoro"}</div>
                <h2 style={{margin:0,color:C.pure,fontSize:20,fontWeight:800,letterSpacing:"-0.02em"}}>
                  {editingId?"Aggiorna documento":"Crea documento"}
                </h2>
                {docNum&&<div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:11,color:C.mid,marginTop:4}}>{docNum}</div>}
              </div>
              <div className="field" style={{margin:0,minWidth:140}}>
                <label>Data</label>
                <input type="date" value={doc.docData} onChange={e=>upDoc("docData",e.target.value)}/>
              </div>
            </div>

            {error&&<div className="err-box">{error}</div>}

            {/* CLIENTE */}
            <div className="sec-label" style={{marginBottom:12}}>Cliente</div>
            <div className="field"><label>Nome / Ragione sociale</label><input value={doc.clienteNome} onChange={e=>upDoc("clienteNome",e.target.value)} placeholder="Mario Rossi"/></div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}} className="field">
              <div><label>Telefono</label><input value={doc.clienteTel} onChange={e=>upDoc("clienteTel",e.target.value)} placeholder="339 000 0000"/></div>
              <div><label>Indirizzo lavoro</label><input value={doc.clienteInd} onChange={e=>upDoc("clienteInd",e.target.value)} placeholder="Via Roma 1, Bergamo"/></div>

            <div className="field"><label>Note cliente</label><input value={doc.clienteNote} onChange={e=>upDoc("clienteNote",e.target.value)} placeholder="es. appartamento piano 2"/></div>

            </div>
            {doc.righeM.map(r=>{
              const t=(Number(r.ore)||0)*(Number(r.prezzoOra)||0);
              return(
                <div key={r.id} className="riga-row">

                    <div><label style={{fontSize:10}}>€/ora</label><input type="number" min="0" step="1" placeholder="0" value={r.prezzoOra} onChange={e=>upM(r.id,"prezzoOra",e.target.value)}/></div>
                    <button className="btn btn-danger" onClick={()=>delM(r.id)} style={{padding:"10px 11px",marginBottom:0}}>✕</button>

            {/* MATERIALI */}

              const t=(Number(r.qta)||0)*(Number(r.prezzoUnit)||0);

                    <div><label style={{fontSize:10}}>Unità</label>
                      <select value={r.unita} onChange={e=>upT(r.id,"unita",e.target.value)}>

                      </select>
                    </div>
                    <div><label style={{fontSize:10}}>Prezzo (€)</label><input type="number" min="0" step="0.01" placeholder="0.00" value={r.prezzoUnit} onChange={e=>upT(r.id,"prezzoUnit",e.target.value)}/></div>
                  </div>
                  {t>0&&<div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:11,color:C.mid,textAlign:"right",marginTop:6}}>= <span style={{color:C.lighter}}>{fmt(t)}</span></div>}

            <button onClick={addT} className="btn btn-secondary" style={{fontSize:12,padding:"7px 14px",marginBottom:20,borderColor:"rgba(200,170,60,0.3)",color:C.gold}}>+ Aggiungi materiale</button>

            {/* RIEPILOGO */}
            <div className="sec-label" style={{marginBottom:12}}>Riepilogo</div>
            <div style={{background:C.dark3,borderRadius:8,padding:"14px 16px",marginBottom:16}}>

              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14,flexWrap:"wrap"}}>

                  <div className="seg">
                    <button className={doc.scontoTipo==="pct"?"on":""} onClick={()=>upDoc("scontoTipo","pct")}>%</button>
                    <button className={doc.scontoTipo==="eur"?"on":""} onClick={()=>upDoc("scontoTipo","eur")}>€</button>
                  </div>
                  <input type="number" min="0" step="1" value={doc.scontoVal} onChange={e=>upDoc("scontoVal",e.target.value)} placeholder="0" style={{width:72,textAlign:"center"}}/>

                {/* IVA toggle */}
                <div className="trk-wrap" onClick={()=>upDoc("ivaOn",!doc.ivaOn)}>

                {doc.ivaOn&&(

                    <input type="number" min="0" max="100" value={doc.ivaPerc} onChange={e=>upDoc("ivaPerc",e.target.value)} style={{width:60,textAlign:"center"}}/>
                    <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:13,color:C.mid}}>%</span>
                  </div>

              </div>
              {/* Righe riepilogo */}
              {(()=>{const c=calcola(doc);return(
                <React.Fragment>
                  <div className="rr"><span className="rl">⚡ Manodopera</span><span className="rv">{fmt(c.totM)}</span></div>

                  {doc.ivaOn&&<div className="rr"><span className="rl">IVA ({c.ip}%)</span><span className="rv">{fmt(c.iAmt)}</span></div>}
                  <div className="rr tot"><span className="rl">TOTALE</span><span className="rv">{fmt(c.tot)}</span></div>
                </React.Fragment>

            </div>

            {/* NOTE */}
            <div className="sec-label" style={{marginBottom:8}}>Note lavoro</div>
            <div className="field"><textarea rows="3" value={doc.noteLavoro} onChange={e=>upDoc("noteLavoro",e.target.value)} placeholder="Note aggiuntive per il cliente..."/></div>

                {saving?"Salvataggio...":editingId?"💾 Salva modifiche":"💾 Salva e genera documento"}
              </button>
            </div>
          </div>
        )}

        {/* ══ DOCUMENTO ══ */}
        {view==="documento"&&current&&(
          <React.Fragment>
            <div style={{marginBottom:16}}>
              <button onClick={stampa} className="btn btn-primary" style={{width:"100%",marginBottom:10,fontSize:15}}>🖨️ Stampa / Salva PDF</button>

                <button onClick={nuovoDoc} className="btn btn-secondary" style={{flex:1}}>+ Nuovo</button>

            <DocPreview doc={current} company={company}/>

        {/* ══ ARCHIVIO ══ */}
        {view==="storico"&&(

            {list.length===0&&(

                </div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  <button onClick={()=>{setCurrent(d);setView("documento");}} className="btn btn-secondary" style={{padding:"7px 12px",fontSize:12}}>Apri</button>

                  <button onClick={()=>eliminaDoc(d.id)} className="btn btn-danger" style={{padding:"7px 12px",fontSize:12}}>✕</button>

        {/* ══ IMPOSTAZIONI ══ */}
        {view==="impostazioni"&&(
          <div className="card">
            <div style={{marginBottom:20}}>
              <div className="sec-label">Configurazione</div>

            <div className="field"><label>Telefono</label><input value={compDraft.telefono} onChange={e=>setCompDraft(c=>({...c,telefono:e.target.value}))}/></div>
            <div className="field"><label>Email</label><input value={compDraft.email} onChange={e=>setCompDraft(c=>({...c,email:e.target.value}))}/></div>
            <button onClick={saveCompany} className="btn btn-primary" style={{width:"100%",marginTop:4}}>Salva dati azienda</button>
          </div>
        )}

      </div>
    </div>

}

/* ── NAV BTN ── */
function NBtn({active,onClick,children}){
  return(
    <button onClick={onClick} style={{
      background:active?"rgba(27,110,243,0.15)":"transparent",
      border:`1px solid ${active?"rgba(27,110,243,0.35)":"rgba(255,255,255,0.1)"}`,
      color:active?"#4D8FF5":"#A0A0A0",
      fontFamily:"'IBM Plex Mono',monospace",fontSize:11,letterSpacing:"0.1em",
      textTransform:"uppercase",padding:"6px 12px",borderRadius:5,cursor:"pointer",
      fontWeight:active?600:400,transition:"all 0.18s",
    }}>{children}</button>
  );
}

/* ── DOC PREVIEW ── */
function DocPreview({doc,company}){
  const c=calcola(doc);
  function f(n){return(Number(n)||0).toLocaleString("it-IT",{style:"currency",currency:"EUR"});}
  const righeM=(doc.righeM||[]).filter(r=>r.ore||r.prezzoOra);
  const righeT=(doc.righeT||[]).filter(r=>r.qta||r.prezzoUnit);
  return(
    <div style={{background:"#fff",color:"#111",padding:"24px 22px",borderRadius:12,boxShadow:"0 1px 4px rgba(0,0,0,0.1)"}}>
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",borderBottom:"2.5px solid #1B6EF3",paddingBottom:12,marginBottom:16}}>
        <div style={{display:"flex",flexDirection:"column",gap:3}}>
          <LogoSVG dark/>
          <div style={{fontSize:10,color:"#666",marginTop:1}}>{company.sottotitolo}</div>
        </div>
        <div style={{textAlign:"right",fontSize:10,color:"#555",lineHeight:1.7}}>
          {company.indirizzo&&<div>{company.indirizzo}</div>}
          {company.telefono&&<div>Tel. {company.telefono}</div>}
          {company.email&&<div>{company.email}</div>}
        </div>
      </div>
      {/* Meta */}
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:16}}>
        <div>
          <div style={{fontSize:20,fontWeight:900,color:"#111",letterSpacing:"-0.5px"}}>CONTO LAVORO</div>
          <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:10,color:"#888",marginTop:2}}>{doc.docNum} · {fmtDate(doc.docData)}</div>
        </div>
        <div style={{textAlign:"right",fontSize:11,color:"#111",lineHeight:1.7}}>
          <div style={{fontWeight:700}}>{doc.clienteNome}</div>
          {doc.clienteTel&&<div style={{color:"#555"}}>{doc.clienteTel}</div>}
          {doc.clienteInd&&<div style={{color:"#555"}}>{doc.clienteInd}</div>}
        </div>
      </div>
      {/* Manodopera */}
      <PSec blue>⚡ Manodopera</PSec>
      <table style={{width:"100%",fontSize:12,borderCollapse:"collapse",marginBottom:4}}>
        <tbody>
          {righeM.map(r=>(
            <tr key={r.id} style={{borderBottom:"1px solid #f5f5f5"}}>
              <td style={{padding:"5px 0",color:"#777"}}>{fmtDate(r.data)}</td>
              <td style={{padding:"5px 0",textAlign:"right",color:"#777"}}>{r.ore||0} h</td>
              <td style={{padding:"5px 0",textAlign:"right",color:"#777"}}>× {f(r.prezzoOra)}</td>
              <td style={{padding:"5px 0",textAlign:"right",fontWeight:600,color:"#111"}}>{f((Number(r.ore)||0)*(Number(r.prezzoOra)||0))}</td>
            </tr>
          ))}
        </tbody>
      </table>
      <div style={{textAlign:"right",fontSize:11,color:"#555",marginBottom:12}}>Totale manodopera: <strong style={{color:"#111"}}>{f(c.totM)}</strong></div>
      {/* Materiali */}
      <PSec gold>◆ Materiali</PSec>
      <table style={{width:"100%",fontSize:12,borderCollapse:"collapse",marginBottom:4}}>
        <tbody>
          {righeT.map(r=>(
            <tr key={r.id} style={{borderBottom:"1px solid #f5f5f5"}}>
              <td style={{padding:"5px 0",color:"#333"}}>{r.desc||"—"}</td>
              <td style={{padding:"5px 0",textAlign:"right",color:"#777"}}>{r.qta} {r.unita}</td>
              <td style={{padding:"5px 0",textAlign:"right",color:"#777"}}>× {f(r.prezzoUnit)}</td>
              <td style={{padding:"5px 0",textAlign:"right",fontWeight:600,color:"#111"}}>{f((Number(r.qta)||0)*(Number(r.prezzoUnit)||0))}</td>
            </tr>
          ))}
        </tbody>
      </table>
      <div style={{textAlign:"right",fontSize:11,color:"#555",marginBottom:12}}>Totale materiali: <strong style={{color:"#111"}}>{f(c.totT)}</strong></div>
      {/* Totale */}
      <div style={{background:"#1B6EF3",color:"#fff",borderRadius:7,padding:"11px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",margin:"12px 0 16px"}}>
        <span style={{fontWeight:700,fontSize:13}}>TOTALE</span>
        <span style={{fontWeight:900,fontSize:20,letterSpacing:"-0.5px"}}>{f(c.tot)}</span>
      </div>
      {/* Approvazione */}
      <div style={{padding:"7px 10px",border:"1px solid #1B6EF3",borderRadius:4,background:"rgba(27,110,243,0.04)",fontSize:12,color:"#111",fontWeight:600,fontStyle:"italic",marginBottom:12}}>
        Il lavoro è stato eseguito secondo le specifiche ed approvato dal cliente.
      </div>
    </div>
  );
}

function PSec({children,blue,gold}){
  return(
    <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:9,fontWeight:700,letterSpacing:"0.14em",textTransform:"uppercase",color:gold?"#9A7A00":"#1B6EF3",borderBottom:`1px solid ${gold?"#e8e0c0":"#e0eaff"}`,paddingBottom:4,marginBottom:8,marginTop:12}}>
      {children}
    </div>
  );
}

/* ── MOUNT ── */
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);

</script>
</body>
</html>
