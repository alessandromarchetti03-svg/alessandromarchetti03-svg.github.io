/* ── HELPERS ── */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function fmt(n){return(Number(n)||0).toLocaleString("it-IT",{style:"currency",currency:"EUR"});}
function todayISO(){return new Date().toISOString().split("T")[0];}
function fmtDate(iso){if(!iso)return"—";const d=new Date(iso);return d.toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric"});}
function genDocNum(nome,dataISO){
  let n="CL";
  if(nome)n+=" - "+nome.trim();
  if(dataISO){const d=new Date(dataISO);const dd=("0"+d.getDate()).slice(-2);const mm=("0"+(d.getMonth()+1)).slice(-2);const yy=String(d.getFullYear()).slice(-2);n+=" "+dd+"."+mm+"."+yy;}
  return n;
}

/* ── SUPABASE API ── */
const API={
  async saveContoLavoro(doc){
    const{error:e1}=await db.from("conti_lavoro").upsert({
      id:doc.id, doc_num:doc.docNum, doc_data:doc.docData,
      cliente_nome:doc.clienteNome, cliente_tel:doc.clienteTel,
      cliente_ind:doc.clienteInd, cliente_note:doc.clienteNote,
      desc_lavoro:doc.descLavoro, note_lavoro:doc.noteLavoro,
      sconto_tipo:doc.scontoTipo, sconto_val:doc.scontoVal,
      iva_on:doc.ivaOn, iva_perc:doc.ivaPerc,
      tot_manodopera:doc.totManodopera, tot_materiali:doc.totMateriali,
      totale_netto:doc.totaleNetto,
    });
    if(e1)throw e1;
    // manodopera
    await db.from("conti_manodopera").delete().eq("conto_id",doc.id);
    if(doc.righeM&&doc.righeM.length>0){
      const{error:e2}=await db.from("conti_manodopera").insert(
        doc.righeM.map(r=>({id:r.id||uid(),conto_id:doc.id,data_riga:r.data,ore:r.ore,prezzo_ora:r.prezzoOra,totale_riga:r.totale}))
      );
      if(e2)throw e2;
    }
    // materiali
    await db.from("conti_materiali").delete().eq("conto_id",doc.id);
    if(doc.righeT&&doc.righeT.length>0){
      const{error:e3}=await db.from("conti_materiali").insert(
        doc.righeT.map(r=>({id:r.id||uid(),conto_id:doc.id,descrizione:r.desc,quantita:r.qta,unita:r.unita,prezzo_unitario:r.prezzoUnit,totale_riga:r.totale}))
      );
      if(e3)throw e3;
    }
  },
  async getAll(){
    const{data:conti,error:e1}=await db.from("conti_lavoro").select("*").order("created_at",{ascending:false});
    if(e1)throw e1;
    const{data:mano,error:e2}=await db.from("conti_manodopera").select("*");
    if(e2)throw e2;
    const{data:mat,error:e3}=await db.from("conti_materiali").select("*");
    if(e3)throw e3;
    return conti.map(c=>({
      id:c.id, docNum:c.doc_num, docData:c.doc_data,
      clienteNome:c.cliente_nome, clienteTel:c.cliente_tel,
      clienteInd:c.cliente_ind, clienteNote:c.cliente_note,
      descLavoro:c.desc_lavoro, noteLavoro:c.note_lavoro,
      scontoTipo:c.sconto_tipo, scontoVal:c.sconto_val,
      ivaOn:c.iva_on, ivaPerc:c.iva_perc,
      totManodopera:c.tot_manodopera, totMateriali:c.tot_materiali,
      totaleNetto:c.totale_netto,
      righeM:mano.filter(r=>r.conto_id===c.id).map(r=>({id:r.id,data:r.data_riga,ore:r.ore,prezzoOra:r.prezzo_ora,totale:r.totale_riga})),
      righeT:mat.filter(r=>r.conto_id===c.id).map(r=>({id:r.id,desc:r.descrizione,qta:r.quantita,unita:r.unita,prezzoUnit:r.prezzo_unitario,totale:r.totale_riga})),
    }));
  },
  async delete(id){
    const{error}=await db.from("conti_lavoro").delete().eq("id",id);
    if(error)throw error;
  },
};

/* ════════════════════════════
   CALCOLI
════════════════════════════ */
function calcola(doc){
  const totM=doc.righeM.reduce((s,r)=>{
    const t=(Number(r.ore)||0)*(Number(r.prezzoOra)||0);
    return s+t;
  },0);
  const totT=doc.righeT.reduce((s,r)=>{
    const t=(Number(r.qta)||0)*(Number(r.prezzoUnit)||0);
    return s+t;
  },0);
  const sub=totM+totT;
  const sv=Number(doc.scontoVal)||0;
  const sAmt=doc.scontoTipo==="pct"?sub*sv/100:Math.min(sv,sub);
  const imp=sub-sAmt;
  const ip=Number(doc.ivaPerc)||22;
  const iAmt=doc.ivaOn?imp*ip/100:0;
  const tot=imp+iAmt;
  return{totM,totT,sub,sAmt,imp,iAmt,tot,ip,sv};
}

  useEffect(()=>{loadAll();},[]);

  async function loadAll(){
    setSyncStatus("loading");setSyncMsg("Sincronizzazione...");
    try{
      const data=await API.getAll();
      setList(data);LS.set("cl-cache",data);
      setSyncStatus("ok");setSyncMsg("Sincronizzato");
    }catch(e){
      const cache=LS.get("cl-cache");
      if(cache)setList(cache);
      setSyncStatus("err");setSyncMsg("Offline — dati locali");
    }

    setDoc(d=>({...d,righeM:d.righeM.map(r=>{
      if(r.id!==id)return r;
      const nr={...r,[f]:v};
      nr.totale=(Number(nr.ore)||0)*(Number(nr.prezzoOra)||0);
      return nr;
    })}));
  }

  function upT(id,f,v){
    setDoc(d=>({...d,righeT:d.righeT.map(r=>{
      if(r.id!==id)return r;
      const nr={...r,[f]:v};
      nr.totale=(Number(nr.qta)||0)*(Number(nr.prezzoUnit)||0);
      return nr;
    })}));

  /* ── SALVA ── */
  async function salva(){
    if(!doc.clienteNome.trim()){setError("Inserisci il nome del cliente.");return;}
    setError("");setSaving(true);
    try{
      const payload={
        ...doc,
        docNum,
        totManodopera:calc.totM,
        totMateriali:calc.totT,
        totaleNetto:calc.tot,
        righeM:doc.righeM.map(r=>({...r,ore:Number(r.ore)||0,prezzoOra:Number(r.prezzoOra)||0,totale:(Number(r.ore)||0)*(Number(r.prezzoOra)||0)})),
        righeT:doc.righeT.map(r=>({...r,qta:Number(r.qta)||0,prezzoUnit:Number(r.prezzoUnit)||0,totale:(Number(r.qta)||0)*(Number(r.prezzoUnit)||0)})),
        scontoVal:Number(doc.scontoVal)||0,
        ivaPerc:Number(doc.ivaPerc)||22,
      };
      await API.saveContoLavoro(payload);
      const newList=editingId
        ?list.map(d=>d.id===editingId?payload:d)
        :[payload,...list];
      setList(newList);LS.set("cl-cache",newList);
      setSyncStatus("ok");setSyncMsg("Sincronizzato");
      setCurrent(payload);setEditingId(null);setView("documento");
    }catch(e){
      setError("Errore salvataggio: "+(e.message||e));setSyncStatus("err");setSyncMsg("Errore cloud");
    }finally{setSaving(false);}
  }

</style></head><body><div class="page">

<div class="hdr">

${d.descLavoro?`
<div class="sec sec-blue">Lavoro svolto</div>

<div class="sec sec-blue">⚡ Manodopera</div>
<table><tbody>

    <td class="grey" style="font-size:10px;width:22%;">Data</td>

</tbody></table>
<div class="subtot">Totale manodopera: <strong>${fP(c.totM)}</strong></div>

<div class="sec sec-gold">◆ Materiali</div>
<table><tbody>

    <td class="grey r" style="font-size:10px;width:10%;">Qtà</td>

    <td class="grey r" style="font-size:10px;width:18%;">Totale</td>
  </tr>
  ${righeT.map(r=>`

    <td class="r grey">${r.qta||0}</td>
    <td class="grey">${r.unita}</td>
    <td class="r grey">${fP(r.prezzoUnit)}</td>

</tbody></table>
<div class="subtot">Totale materiali: <strong>${fP(c.totT)}</strong></div>

<div class="riepi">
  <div class="rr"><span class="rl">⚡ Manodopera</span><span class="rv">${fP(c.totM)}</span></div>
  <div class="rr"><span class="rl">◆ Materiali</span><span class="rv">${fP(c.totT)}</span></div>

<div class="tot-bar">

</div>

${d.noteLavoro?`
<div class="sec sec-blue">Note</div>
<div style="font-size:12px;color:#555;white-space:pre-wrap;margin-bottom:16px;line-height:1.65;">${d.noteLavoro}</div>`:""}

<div class="approv">Il lavoro è stato eseguito secondo le specifiche ed approvato dal cliente.</div>

</div>
</div>
<script>window.onload=function(){setTimeout(function(){window.print();},400);};<\/script>

            <div style={{display:"flex",alignItems:"center",fontFamily:"'IBM Plex Mono',monospace",fontSize:9.5,color:C.mid,cursor:"pointer"}} onClick={loadAll}>

          </div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>

            </div>
            <div className="field"><label>Note cliente</label><input value={doc.clienteNote} onChange={e=>upDoc("clienteNote",e.target.value)} placeholder="es. appartamento piano 2"/></div>

                    <div><label style={{fontSize:10}}>€/ora</label><input type="number" min="0" step="1" placeholder="0" value={r.prezzoOra} onChange={e=>upM(r.id,"prezzoOra",e.target.value)}/></div>
                    <button className="btn btn-danger" onClick={()=>delM(r.id)} style={{padding:"10px 11px",marginBottom:0}}>✕</button>
                  </div>
                  {t>0&&<div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:11,color:C.mid,textAlign:"right",marginTop:6}}>= <span style={{color:C.lighter}}>{fmt(t)}</span></div>}
                </div>
              );
            })}
            <button onClick={addM} className="btn btn-secondary" style={{fontSize:12,padding:"7px 14px",marginBottom:20}}>+ Aggiungi giornata</button>

              const t=(Number(r.qta)||0)*(Number(r.prezzoUnit)||0);

                <div key={r.id} className="riga-row">

              );
            })}
            <button onClick={addT} className="btn btn-secondary" style={{fontSize:12,padding:"7px 14px",marginBottom:20,borderColor:"rgba(200,170,60,0.3)",color:C.gold}}>+ Aggiungi materiale</button>

            {/* RIEPILOGO */}
            <div className="sec-label" style={{marginBottom:12}}>Riepilogo</div>

                {saving?"Salvataggio...":editingId?"💾 Salva modifiche":"💾 Salva e genera documento"}

        {/* ══ IMPOSTAZIONI ══ */}

            <div className="field"><label>Partita IVA</label><input value={compDraft.piva} onChange={e=>setCompDraft(c=>({...c,piva:e.target.value}))} placeholder="Lascia vuoto se non ancora attiva"/></div>
            <div className="field"><label>Indirizzo</label><input value={compDraft.indirizzo} onChange={e=>setCompDraft(c=>({...c,indirizzo:e.target.value}))}/></div>
            <div className="field"><label>Telefono</label><input value={compDraft.telefono} onChange={e=>setCompDraft(c=>({...c,telefono:e.target.value}))}/></div>
            <div className="field"><label>Email</label><input value={compDraft.email} onChange={e=>setCompDraft(c=>({...c,email:e.target.value}))}/></div>
            <button onClick={saveCompany} className="btn btn-primary" style={{width:"100%",marginTop:4}}>Salva dati azienda</button>
          </div>
        )}

      </div>
    </div>
  );
}

/* ── NAV BTN ── */
function NBtn({active,onClick,children}){
  return(
    <button onClick={onClick} style={{
      background:active?"rgba(27,110,243,0.15)":"transparent",
      border:`1px solid ${active?"rgba(27,110,243,0.4)":"rgba(255,255,255,0.1)"}`,
      color:active?"#4D8FF5":"#A0A0A0",
      fontFamily:"'IBM Plex Mono',monospace",fontSize:10.5,letterSpacing:"0.08em",
      textTransform:"uppercase",padding:"8px 6px",borderRadius:6,cursor:"pointer",
      fontWeight:active?700:400,transition:"all 0.18s",width:"100%",whiteSpace:"nowrap",
    }}>{children}</button>
  );
}

/* ── DOC PREVIEW ── */
function DocPreview({doc,company}){
  const c=calcola(doc);
  function f(n){return(Number(n)||0).toLocaleString("it-IT",{style:"currency",currency:"EUR"});}
  const righeM=(doc.righeM||[]).filter(r=>r.ore||r.prezzoOra);
  const righeT=(doc.righeT||[]).filter(r=>r.qta||r.prezzoUnit);
  return(
    <div style={{background:"#fff",color:"#111",padding:"24px 22px",borderRadius:12,boxShadow:"0 1px 4px rgba(0,0,0,0.1)"}}>
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",borderBottom:"2.5px solid #1B6EF3",paddingBottom:12,marginBottom:16}}>
        <div style={{display:"flex",flexDirection:"column",gap:3}}>
          <LogoSVG dark/>
          <div style={{fontSize:10,color:"#666",marginTop:1}}>{company.sottotitolo}</div>
        </div>
        <div style={{textAlign:"right",fontSize:10,color:"#555",lineHeight:1.7,alignSelf:"flex-end"}}>
          {company.indirizzo&&<div>{company.indirizzo}</div>}
          {company.telefono&&<div>Tel. {company.telefono}</div>}
          {company.email&&<div>{company.email}</div>}
        </div>
      </div>
      {/* Meta */}
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:16}}>
        <div>
          <div style={{fontSize:20,fontWeight:900,color:"#111",letterSpacing:"-0.5px"}}>CONTO LAVORO</div>
          <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:10,color:"#888",marginTop:2}}>{doc.docNum} · {fmtDate(doc.docData)}</div>
        </div>
        <div style={{textAlign:"right",fontSize:11,color:"#111",lineHeight:1.7}}>
          <div style={{fontWeight:700}}>{doc.clienteNome}</div>
          {doc.clienteTel&&<div style={{color:"#555"}}>{doc.clienteTel}</div>}
          {doc.clienteInd&&<div style={{color:"#555"}}>{doc.clienteInd}</div>}
        </div>
      </div>
      {/* Manodopera */}
      <PSec blue>⚡ Manodopera</PSec>
      <table style={{width:"100%",fontSize:12,borderCollapse:"collapse",marginBottom:4}}>
        <tbody>
          {righeM.map(r=>(
            <tr key={r.id} style={{borderBottom:"1px solid #f5f5f5"}}>
              <td style={{padding:"5px 0",color:"#777"}}>{fmtDate(r.data)}</td>
              <td style={{padding:"5px 0",textAlign:"right",color:"#777"}}>{r.ore||0} h</td>
              <td style={{padding:"5px 0",textAlign:"right",color:"#777"}}>× {f(r.prezzoOra)}</td>
              <td style={{padding:"5px 0",textAlign:"right",fontWeight:600,color:"#111"}}>{f((Number(r.ore)||0)*(Number(r.prezzoOra)||0))}</td>
            </tr>
          ))}
        </tbody>
      </table>
      <div style={{textAlign:"right",fontSize:11,color:"#555",marginBottom:12}}>Totale manodopera: <strong style={{color:"#111"}}>{f(c.totM)}</strong></div>
      {/* Materiali */}
      <PSec gold>◆ Materiali</PSec>
      <table style={{width:"100%",fontSize:12,borderCollapse:"collapse",marginBottom:4}}>
        <tbody>
          {righeT.map(r=>(
            <tr key={r.id} style={{borderBottom:"1px solid #f5f5f5"}}>
              <td style={{padding:"5px 0",color:"#333"}}>{r.desc||"—"}</td>
              <td style={{padding:"5px 0",textAlign:"right",color:"#777"}}>{r.qta} {r.unita}</td>
              <td style={{padding:"5px 0",textAlign:"right",color:"#777"}}>× {f(r.prezzoUnit)}</td>
              <td style={{padding:"5px 0",textAlign:"right",fontWeight:600,color:"#111"}}>{f((Number(r.qta)||0)*(Number(r.prezzoUnit)||0))}</td>
            </tr>
          ))}
        </tbody>
      </table>
      <div style={{textAlign:"right",fontSize:11,color:"#555",marginBottom:12}}>Totale materiali: <strong style={{color:"#111"}}>{f(c.totT)}</strong></div>
      {/* Totale */}
      <div style={{background:"#1B6EF3",color:"#fff",borderRadius:7,padding:"11px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",margin:"12px 0 16px"}}>
        <span style={{fontWeight:700,fontSize:13}}>TOTALE</span>
        <span style={{fontWeight:900,fontSize:20,letterSpacing:"-0.5px"}}>{f(c.tot)}</span>
      </div>
      {/* Approvazione */}
      <div style={{padding:"7px 10px",border:"1px solid #1B6EF3",borderRadius:4,background:"rgba(27,110,243,0.04)",fontSize:12,color:"#111",fontWeight:600,fontStyle:"italic",marginBottom:12}}>
        Il lavoro è stato eseguito secondo le specifiche ed approvato dal cliente.
      </div>
    </div>
  );
}

function PSec({children,blue,gold}){
  return(
    <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:9,fontWeight:700,letterSpacing:"0.14em",textTransform:"uppercase",color:gold?"#9A7A00":"#1B6EF3",borderBottom:`1px solid ${gold?"#e8e0c0":"#e0eaff"}`,paddingBottom:4,marginBottom:8,marginTop:12}}>
      {children}
    </div>
  );
}

/* ── MOUNT ── */
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);

</script>
</body>
</html>
