/* ── HELPERS ── */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ── LOCAL STORAGE (cache offline) ── */
const LS = {
  get(k)    { try { const v=localStorage.getItem(k); return v?JSON.parse(v):null; } catch(e){return null;} },
  set(k,v)  { try { localStorage.setItem(k,JSON.stringify(v)); } catch(e){} },
};

/* ── SUPABASE API ── */
const API = {
  async getCounter() {
    const { data, error } = await db.from("contatore").select("valore").eq("id",1).single();
    if (error) throw error;
    return data.valore;
  },
  async incrementCounter() {
    const cur = await API.getCounter();
    const next = cur + 1;
    const { error } = await db.from("contatore").update({valore: next}).eq("id",1);
    if (error) throw error;
    return next;
  },
  async savePreventivo(doc) {
    // upsert preventivo
    const { error: e1 } = await db.from("preventivi").upsert({
      id: doc.id, numero: doc.numero, data: doc.data,
      cliente: doc.cliente, telefono: doc.telefono, indirizzo: doc.indirizzo,
      lavoro: doc.lavoro, ore: doc.ore, tariffa_oraria: doc.tariffaOraria,
      persone: doc.persone, sconto_tipo: doc.scontoTipo, sconto_valore: doc.scontoValore,
      note: doc.note, subtotale_manodopera: doc.subtotaleManodopera,
      subtotale_materiali: doc.subtotaleMateriali, totale_lordo: doc.totaleLordo,
      sconto_valore_calc: doc.scontoValoreCalc, totale_netto: doc.totaleNetto,
    });
    if (e1) throw e1;
    // delete old materiali and reinsert
    await db.from("preventivi_materiali").delete().eq("preventivo_id", doc.id);
    if (doc.materiali && doc.materiali.length > 0) {
      const rows = doc.materiali.map(m => ({
        id: m.id || uid(),
        preventivo_id: doc.id,
        descrizione: m.desc || m.descrizione || "",
        quantita: m.quantita,
        unita: m.unita,
        prezzo_unitario: m.prezzoUnitario || m.prezzo_unitario,
        totale_riga: m.totaleRiga || m.totale_riga,
      }));
      const { error: e2 } = await db.from("preventivi_materiali").insert(rows);
      if (e2) throw e2;
    }
  },
  async getAll() {
    const { data: preventivi, error: e1 } = await db
      .from("preventivi")
      .select("*")
      .order("created_at", { ascending: false });
    if (e1) throw e1;
    const { data: materiali, error: e2 } = await db
      .from("preventivi_materiali")
      .select("*");
    if (e2) throw e2;
    return preventivi.map(p => ({
      id: p.id, numero: p.numero, data: p.data,
      cliente: p.cliente, telefono: p.telefono, indirizzo: p.indirizzo,
      lavoro: p.lavoro, ore: p.ore, tariffaOraria: p.tariffa_oraria,
      persone: p.persone, scontoTipo: p.sconto_tipo, scontoValore: p.sconto_valore,
      note: p.note, subtotaleManodopera: p.subtotale_manodopera,
      subtotaleMateriali: p.subtotale_materiali, totaleLordo: p.totale_lordo,
      scontoValoreCalc: p.sconto_valore_calc, totaleNetto: p.totale_netto,
      materiali: materiali
        .filter(m => m.preventivo_id === p.id)
        .map(m => ({
          id: m.id, desc: m.descrizione, quantita: m.quantita,
          unita: m.unita, prezzoUnitario: m.prezzo_unitario, totaleRiga: m.totale_riga,
        })),
    }));
  },
  async deletePreventivo(id) {
    const { error } = await db.from("preventivi").delete().eq("id", id);
    if (error) throw error;
  },
};

  const [form, setForm]             = useState(emptyForm());
  const [company, setCompany]       = useState(() => LS.get("company-info") || defaultCompany);
  const [companyDraft, setCompanyDraft] = useState(() => LS.get("company-info") || defaultCompany);
  const [list, setList]             = useState([]);
  const [current, setCurrent]       = useState(null);
  const [editingId, setEditingId]   = useState(null);
  const [error, setError]           = useState("");
  const [syncStatus, setSyncStatus] = useState("loading"); // "ok" | "err" | "loading"
  const [syncMsg, setSyncMsg]       = useState("Connessione...");
  const [saving, setSaving]         = useState(false);

  /* ── CARICA DATI ALL'AVVIO ── */
  useEffect(() => {
    loadAll();
  }, []);

  async function loadAll() {
    setSyncStatus("loading"); setSyncMsg("Sincronizzazione...");
    try {
      const docs = await API.getAll();
      setList(docs);
      LS.set("preventivi-cache", docs);
      setSyncStatus("ok"); setSyncMsg("Sincronizzato");
    } catch(e) {
      // fallback su cache locale
      const cache = LS.get("preventivi-cache");
      if (cache) setList(cache);
      setSyncStatus("err"); setSyncMsg("Offline — dati locali");
    }
  }

  /* ── FORM HELPERS ── */
  function updateForm(f,v) { setForm(p=>({...p,[f]:v})); }
  function updateMateriale(id,f,v) { setForm(p=>({...p,materiali:p.materiali.map(m=>m.id===id?{...m,[f]:v}:m)})); }
  function addMateriale() { setForm(p=>({...p,materiali:[...p.materiali,{id:uid(),desc:"",quantita:"1",unita:"pz",prezzoUnitario:""}]})); }
  function removeMateriale(id) { setForm(p=>({...p,materiali:p.materiali.filter(m=>m.id!==id)})); }

  /* ── CALCOLI ── */
  const subMano = (Number(form.ore)||0)*(Number(form.tariffaOraria)||0)*(Number(form.persone)||1);
  const subMat  = form.materiali.reduce((s,m)=>s+(Number(m.quantita)||0)*(Number(m.prezzoUnitario)||0),0);
  const totLordo = subMano + subMat;
  const scontoCalc = form.scontoTipo==="percentuale"
    ? totLordo*(Number(form.scontoValore)||0)/100
    : Number(form.scontoValore)||0;
  const totNetto = Math.max(totLordo - scontoCalc, 0);

  /* ── VALIDA ── */
  function valida() {
    if (!form.cliente.trim()) return "Inserisci il nome del cliente.";
    if (!form.lavoro.trim())  return "Descrivi il lavoro.";
    return "";
  }

  function vaiAnteprima() {
    const err = valida();
    if (err) { setError(err); return; }
    setError(""); setView("anteprima");
  }

  /* ── SALVA ── */
  async function confermaEGenera() {
    setSaving(true); setError("");
    try {
      const materiali = form.materiali
        .filter(m=>m.desc.trim()||m.prezzoUnitario)
        .map(m=>({...m, totaleRiga:(Number(m.quantita)||0)*(Number(m.prezzoUnitario)||0)}));

      let doc;
      if (editingId) {
        const existing = list.find(d=>d.id===editingId);
        doc = { ...existing, cliente:form.cliente, telefono:form.telefono, indirizzo:form.indirizzo,
          lavoro:form.lavoro, ore:Number(form.ore)||0, tariffaOraria:Number(form.tariffaOraria)||0,
          persone:Number(form.persone)||1, materiali, scontoTipo:form.scontoTipo,
          scontoValore:Number(form.scontoValore)||0, note:form.note,
          subtotaleManodopera:subMano, subtotaleMateriali:subMat,
          totaleLordo:totLordo, scontoValoreCalc:scontoCalc, totaleNetto:totNetto,
        };
        await API.savePreventivo(doc);
        setList(l=>l.map(d=>d.id===editingId?doc:d));
        LS.set("preventivi-cache", list.map(d=>d.id===editingId?doc:d));
      } else {
        const numero = await API.incrementCounter();
        const anno = new Date().getFullYear();
        doc = {
          id: uid(),
          numero: `${anno}-${String(numero).padStart(3,"0")}`,
          data: todayStr(),
          cliente:form.cliente, telefono:form.telefono, indirizzo:form.indirizzo,
          lavoro:form.lavoro, ore:Number(form.ore)||0, tariffaOraria:Number(form.tariffaOraria)||0,
          persone:Number(form.persone)||1, materiali, scontoTipo:form.scontoTipo,
          scontoValore:Number(form.scontoValore)||0, note:form.note,
          subtotaleManodopera:subMano, subtotaleMateriali:subMat,
          totaleLordo:totLordo, scontoValoreCalc:scontoCalc, totaleNetto:totNetto,
        };
        await API.savePreventivo(doc);
        const newList = [doc, ...list];
        setList(newList);
        LS.set("preventivi-cache", newList);
      }
      setSyncStatus("ok"); setSyncMsg("Sincronizzato");
      setCurrent(doc); setEditingId(null); setView("documento");
    } catch(e) {
      setError("Errore salvataggio: " + (e.message || e)); setSyncStatus("err");
    } finally { setSaving(false); }
  }

  function nuovoPreventivo() { setForm(emptyForm()); setCurrent(null); setEditingId(null); setError(""); setView("form"); }

  function modificaPreventivo(doc) {
    setForm({

        : [{id:uid(),desc:"",quantita:"1",unita:"pz",prezzoUnitario:""}],
      scontoTipo:doc.scontoTipo||"percentuale", scontoValore:String(doc.scontoValore??""), note:doc.note||"",
    });
    setEditingId(doc.id); setError(""); setView("form");
  }

  async function eliminaPreventivo(id) {
    if (!confirm("Eliminare questo preventivo?")) return;
    try {
      await API.deletePreventivo(id);

      ${co.piva?`<div>P.IVA ${co.piva}</div>`:""}
    </div>
  </div>
  <div class="meta">
    <div>
      <div class="meta-tipo">PREVENTIVO</div>
      <div class="meta-num">N° ${doc.numero} · ${doc.data}</div>
    </div>
    <div class="meta-cli">
      <strong>${doc.cliente}</strong>
      ${doc.telefono?`<br/>${doc.telefono}`:""}
      ${doc.indirizzo?`<br/>${doc.indirizzo}`:""}
    </div>
  </div>
  <div class="sec">Lavoro svolto</div>
  <div style="font-size:13px;color:#333;white-space:pre-wrap;margin-bottom:16px;line-height:1.6;">${doc.lavoro||""}</div>
  <div class="sec">Dettaglio costi</div>
  <table><tbody>
    <tr>
      <td>Manodopera (${doc.ore} h × ${doc.persone||1} pers. × ${fmtP(doc.tariffaOraria)})</td>
      <td class="r" style="font-weight:600;">${fmtP(doc.subtotaleManodopera)}</td>
    </tr>
    ${(doc.materiali||[]).map(m=>`
    <tr>
      <td>${m.desc||"—"} <span style="color:#999;">(${m.quantita} ${m.unita} × ${fmtP(m.prezzoUnitario)})</span></td>
      <td class="r" style="color:#555;">${fmtP(m.totaleRiga)}</td>
    </tr>`).join("")}
    <tr class="subtot-row">
      <td>Totale lordo</td><td class="r">${fmtP(doc.totaleLordo)}</td>
    </tr>
    ${doc.scontoValoreCalc>0?`
    <tr>
      <td style="color:#c00;">Sconto${doc.scontoTipo==="percentuale"?" ("+doc.scontoValore+"%)":" fisso"}</td>
      <td class="r" style="color:#c00;">− ${fmtP(doc.scontoValoreCalc)}</td>
    </tr>`:""}
  </tbody></table>
  <div class="tot-bar">
    <span style="font-weight:700;font-size:13px;">TOTALE PREVENTIVO</span>
    <span style="font-weight:900;font-size:22px;letter-spacing:-0.5px;">${fmtP(doc.totaleNetto)}</span>
  </div>
  ${doc.note?`<div class="sec">Note</div><div style="font-size:12px;color:#555;white-space:pre-wrap;margin-bottom:20px;line-height:1.65;">${doc.note}</div>`:""}
  <div class="disclaimer">
    Il presente preventivo ha validità 30 giorni dalla data di emissione, salvo diverso accordo scritto tra le parti.
    I prezzi si intendono IVA esclusa, salvo diversa indicazione. Offerta soggetta a sopralluogo.
  </div>
  <div class="firme">
    <div class="firma"><div class="firma-line"></div><div class="firma-label">Firma azienda</div></div>
    <div class="firma"><div class="firma-line"></div><div class="firma-label">Firma cliente per accettazione</div></div>
  </div>
</div>
<script>window.onload=function(){setTimeout(function(){window.print();},400);};<\/script>
</body></html>`;

    const w = window.open("","_blank","width=800,height=900");
    if (w) { w.document.write(html); w.document.close(); }
    else alert("Abilita i popup per esportare il PDF.");
  }

  /* ════════════════════════════
     RENDER
  ════════════════════════════ */
  return (
    <div style={{fontFamily:"'Inter',sans-serif",minHeight:"100vh",background:C.black}}>
      <style>{GLOBAL_CSS}</style>

      {/* NAV */}
      <nav className="no-print" style={{
        position:"sticky",top:0,zIndex:100,
        background:"rgba(10,10,10,0.95)",backdropFilter:"blur(16px)",
        borderBottom:"1px solid rgba(255,255,255,0.06)",
      }}>
        <div style={{maxWidth:660,margin:"0 auto",padding:"0 16px",display:"flex",justifyContent:"space-between",alignItems:"center",height:58}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <LogoSVG size={32}/>
            <div>
              <div style={{fontWeight:800,fontSize:15,letterSpacing:"-0.02em",color:C.pure,lineHeight:1}}>
                Emme<span style={{color:C.blue}}>2000</span>
              </div>
              <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:9,letterSpacing:"0.14em",textTransform:"uppercase",color:C.mid}}>
                Preventivi
              </div>
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            {/* Sync indicator */}
            <div style={{display:"flex",alignItems:"center",fontFamily:"'IBM Plex Mono',monospace",fontSize:10,color:C.mid,cursor:"pointer"}} onClick={loadAll}>
              <span className={`sync-dot ${syncStatus==="ok"?"sync-ok":syncStatus==="err"?"sync-err":"sync-loading"}`}></span>
              <span style={{display:window.innerWidth>400?"inline":"none"}}>{syncMsg}</span>
            </div>
            <NavBtn active={view==="form"||view==="anteprima"||view==="documento"} onClick={nuovoPreventivo}>+ Nuovo</NavBtn>
            <NavBtn active={view==="storico"} onClick={()=>{ loadAll(); setView("storico"); }}>Storico</NavBtn>
            <NavBtn active={view==="impostazioni"} onClick={()=>setView("impostazioni")}>Azienda</NavBtn>
          </div>
        </div>
      </nav>

      <div style={{maxWidth:660,margin:"0 auto",padding:"24px 16px 80px"}}>

        {/* ══ FORM ══ */}
        {view==="form" && (
          <div className="card no-print">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <div>
                <div className="sec-label">{editingId?"Modifica preventivo":"Nuovo preventivo"}</div>
                <h2 style={{margin:0,color:C.pure,fontSize:20,fontWeight:800,letterSpacing:"-0.02em"}}>
                  {editingId?"Aggiorna dati":"Crea documento"}
                </h2>
              </div>
              <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:12,color:C.mid}}>{todayStr()}</div>
            </div>

            {error && <div className="err-box">{error}</div>}

            <div className="sec-label" style={{marginBottom:12}}>Dati cliente</div>
            <div className="field"><label>Cliente</label><input value={form.cliente} onChange={e=>updateForm("cliente",e.target.value)} placeholder="Nome e cognome / ragione sociale"/></div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}} className="field">
              <div><label>Telefono</label><input value={form.telefono} onChange={e=>updateForm("telefono",e.target.value)} placeholder="333 1234567"/></div>
              <div><label>Indirizzo</label><input value={form.indirizzo} onChange={e=>updateForm("indirizzo",e.target.value)} placeholder="Via, numero, comune"/></div>
            </div>

            <div className="sec-label" style={{marginBottom:12,marginTop:4}}>Lavoro</div>
            <div className="field">
              <label>Lavoro svolto / da svolgere</label>
              <textarea rows="4" value={form.lavoro} onChange={e=>updateForm("lavoro",e.target.value)} placeholder="Descrizione dell'intervento..."/>
            </div>

            <div className="sec-label" style={{marginBottom:12}}>⚡ Manodopera</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}} className="field">
              <div><label>Ore</label><input type="number" min="0" step="0.5" value={form.ore} onChange={e=>updateForm("ore",e.target.value)} placeholder="0"/></div>
              <div><label>Persone</label><input type="number" min="1" step="1" value={form.persone} onChange={e=>updateForm("persone",e.target.value)} placeholder="1"/></div>
              <div><label>€/ora</label><input type="number" min="0" step="1" value={form.tariffaOraria} onChange={e=>updateForm("tariffaOraria",e.target.value)} placeholder="35"/></div>
            </div>
            <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:12,color:C.mid,marginTop:-6,marginBottom:18}}>
              {form.ore||0} h × {form.persone||1} pers. × {fmt(form.tariffaOraria)} = <span style={{color:C.blueLight,fontWeight:600}}>{fmt(subMano)}</span>
            </div>

            <div className="sec-label" style={{marginBottom:12}}>◆ Materiali</div>
            {form.materiali.map(m=>{
              const tr=(Number(m.quantita)||0)*(Number(m.prezzoUnitario)||0);
              return (
                <div key={m.id} className="mat-row">
                  <div style={{display:"flex",gap:8,marginBottom:10}}>
                    <input placeholder="Descrizione materiale" value={m.desc} onChange={e=>updateMateriale(m.id,"desc",e.target.value)} style={{flex:1}}/>
                    <button className="btn btn-danger" onClick={()=>removeMateriale(m.id)} style={{padding:"9px 12px",flexShrink:0}}>✕</button>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1.3fr",gap:8}}>
                    <div><label style={{fontSize:10}}>Qtà</label><input type="number" min="0" step="0.5" placeholder="1" value={m.quantita} onChange={e=>updateMateriale(m.id,"quantita",e.target.value)}/></div>
                    <div><label style={{fontSize:10}}>Unità</label>
                      <select value={m.unita} onChange={e=>updateMateriale(m.id,"unita",e.target.value)}>
                        <option>pz</option><option>mt</option><option>kg</option><option>l</option><option>mq</option><option>conf</option>
                      </select>
                    </div>
                    <div><label style={{fontSize:10}}>Prezzo (€)</label><input type="number" min="0" step="0.01" placeholder="0.00" value={m.prezzoUnitario} onChange={e=>updateMateriale(m.id,"prezzoUnitario",e.target.value)}/></div>
                  </div>
                  {tr>0 && <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:12,color:C.mid,textAlign:"right",marginTop:6}}>Totale: <span style={{color:C.lighter}}>{fmt(tr)}</span></div>}
                </div>
              );
            })}
            <button onClick={addMateriale} className="btn btn-secondary" style={{fontSize:13,padding:"8px 14px",marginBottom:14}}>+ Aggiungi materiale</button>
            {subMat>0 && <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:12,color:C.mid,marginBottom:18}}>Totale materiali: <span style={{color:"#CCAA44"}}>{fmt(subMat)}</span></div>}

            <button onClick={vaiAnteprima} className="btn btn-primary" style={{width:"100%",fontSize:15,padding:"13px 20px"}}>
              Genera anteprima →
            </button>
          </div>
        )}

        {/* ══ ANTEPRIMA ══ */}
        {view==="anteprima" && (
          <div className="card no-print">
            <div style={{marginBottom:20}}>
              <div className="sec-label">Riepilogo</div>
              <h2 style={{margin:0,color:C.pure,fontSize:20,fontWeight:800,letterSpacing:"-0.02em"}}>Anteprima preventivo</h2>
              <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:12,color:C.mid,marginTop:4}}>{form.cliente} · {todayStr()}</div>
            </div>

            <div className="riepi-box">
              <RRow label="⚡ Manodopera" value={fmt(subMano)} sub={`${form.ore||0} h × ${form.persone||1} pers. × ${fmt(form.tariffaOraria)}`}/>
              <RRow label="◆ Materiali" value={fmt(subMat)}/>
              <div style={{borderTop:"1px solid rgba(255,255,255,0.08)",margin:"10px 0"}}></div>
              <RRow label="Totale lordo" value={fmt(totLordo)} bold/>
            </div>

            <div style={{display:"grid",gridTemplateColumns:"auto 1fr",gap:12,alignItems:"end"}} className="field">
              <div>
                <label>Tipo sconto</label>
                <select value={form.scontoTipo} onChange={e=>updateForm("scontoTipo",e.target.value)} style={{width:80}}>
                  <option value="percentuale">%</option>
                  <option value="fisso">€</option>
                </select>
              </div>
              <div>
                <label>Valore sconto</label>
                <input type="number" min="0" step="1" value={form.scontoValore} onChange={e=>updateForm("scontoValore",e.target.value)} placeholder="0"/>
              </div>
            </div>
            <div className="field">
              <label>Note</label>
              <textarea rows="3" value={form.note} onChange={e=>updateForm("note",e.target.value)} placeholder="Validità offerta, tempistiche, esclusioni..."/>
            </div>

            <div className="tot-bar">
              <span style={{fontWeight:700,fontSize:14,color:C.pure}}>Totale preventivo</span>
              <span style={{fontWeight:900,fontSize:22,color:C.pure,letterSpacing:"-0.02em"}}>{fmt(totNetto)}</span>
            </div>

            {error && <div className="err-box">{error}</div>}

            <div style={{display:"flex",gap:10,marginTop:4}}>
              <button onClick={()=>setView("form")} className="btn btn-secondary" style={{flex:1}}>← Modifica</button>
              <button onClick={confermaEGenera} className="btn btn-primary" style={{flex:2}} disabled={saving}>
                {saving?"Salvataggio...": editingId?"Salva modifiche":"Genera documento"}
              </button>
            </div>
          </div>
        )}

        {/* ══ DOCUMENTO ══ */}
        {view==="documento" && current && (
          <React.Fragment>
            <div className="no-print" style={{marginBottom:16}}>
              <button onClick={stampa} className="btn btn-primary" style={{width:"100%",marginBottom:10,fontSize:15}}>🖨️ Stampa / Salva PDF</button>
              <div style={{display:"flex",gap:10}}>
                <button onClick={()=>modificaPreventivo(current)} className="btn btn-secondary" style={{flex:1}}>✎ Modifica</button>
                <button onClick={nuovoPreventivo} className="btn btn-secondary" style={{flex:1}}>+ Nuovo</button>
                <button onClick={()=>eliminaPreventivo(current.id)} className="btn btn-danger" style={{flex:1}}>Elimina</button>
              </div>
            </div>
            <DocPreview doc={current} company={company}/>
          </React.Fragment>
        )}

        {/* ══ STORICO ══ */}
        {view==="storico" && (
          <div className="card no-print">
            <div style={{marginBottom:20}}>
              <div className="sec-label">Archivio cloud</div>
              <h2 style={{margin:0,color:C.pure,fontSize:20,fontWeight:800,letterSpacing:"-0.02em"}}>Storico preventivi</h2>
              <div style={{display:"flex",alignItems:"center",marginTop:6,fontFamily:"'IBM Plex Mono',monospace",fontSize:11,color:C.mid}}>
                <span className={`sync-dot ${syncStatus==="ok"?"sync-ok":syncStatus==="err"?"sync-err":"sync-loading"}`}></span>
                {list.length} documenti · {syncMsg}
              </div>
            </div>
            {list.length===0 && (
              <div style={{textAlign:"center",padding:"30px 0",fontFamily:"'IBM Plex Mono',monospace",fontSize:12,color:C.mid,letterSpacing:"0.1em",textTransform:"uppercase"}}>
                Nessun preventivo salvato
              </div>
            )}
            {list.map(d=>(
              <div key={d.id} className="storico-row">
                <div>
                  <div style={{fontWeight:700,color:C.pure,marginBottom:3}}>{d.cliente}</div>
                  <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:11,color:C.mid}}>N° {d.numero} · {d.data}</div>
                  <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:12,color:C.blueLight,marginTop:2,fontWeight:600}}>{fmt(d.totaleNetto)}</div>
                </div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  <button onClick={()=>{setCurrent(d);setView("documento");}} className="btn btn-secondary" style={{padding:"7px 12px",fontSize:12}}>Apri</button>
                  <button onClick={()=>modificaPreventivo(d)} className="btn btn-secondary" style={{padding:"7px 12px",fontSize:12}}>✎</button>
                  <button onClick={()=>eliminaPreventivo(d.id)} className="btn btn-danger" style={{padding:"7px 12px",fontSize:12}}>✕</button>
                </div>
              </div>
            ))}
          </div>
        )}

        {/* ══ IMPOSTAZIONI ══ */}
        {view==="impostazioni" && (
          <div className="card no-print">
            <div style={{marginBottom:20}}>
              <div className="sec-label">Configurazione</div>
              <h2 style={{margin:0,color:C.pure,fontSize:20,fontWeight:800,letterSpacing:"-0.02em"}}>Dati azienda</h2>
            </div>
            <div className="field"><label>Ragione sociale</label><input value={companyDraft.ragioneSociale} onChange={e=>setCompanyDraft(c=>({...c,ragioneSociale:e.target.value}))}/></div>
            <div className="field"><label>Sottotitolo</label><input value={companyDraft.sottotitolo} onChange={e=>setCompanyDraft(c=>({...c,sottotitolo:e.target.value}))}/></div>
            <div className="field"><label>Partita IVA</label><input value={companyDraft.piva} onChange={e=>setCompanyDraft(c=>({...c,piva:e.target.value}))} placeholder="Lascia vuoto se non ancora attiva"/></div>
            <div className="field"><label>Indirizzo</label><input value={companyDraft.indirizzo} onChange={e=>setCompanyDraft(c=>({...c,indirizzo:e.target.value}))}/></div>
            <div className="field"><label>Telefono</label><input value={companyDraft.telefono} onChange={e=>setCompanyDraft(c=>({...c,telefono:e.target.value}))}/></div>
            <div className="field"><label>Email</label><input value={companyDraft.email} onChange={e=>setCompanyDraft(c=>({...c,email:e.target.value}))}/></div>
            <button onClick={saveCompany} className="btn btn-primary" style={{width:"100%",marginTop:4}}>Salva dati azienda</button>
          </div>
        )}

      </div>
    </div>
  );
}

/* ── NAV BTN ── */
function NavBtn({active,onClick,children}) {
  return (
    <button onClick={onClick} style={{
      background:active?"rgba(27,110,243,0.15)":"transparent",
      border:`1px solid ${active?"rgba(27,110,243,0.35)":"rgba(255,255,255,0.1)"}`,
      color:active?"#4D8FF5":"#A0A0A0",
      fontFamily:"'IBM Plex Mono',monospace",fontSize:11,letterSpacing:"0.1em",
      textTransform:"uppercase",padding:"6px 12px",borderRadius:5,cursor:"pointer",
      fontWeight:active?600:400,transition:"all 0.18s",
    }}>{children}</button>
  );
}

/* ── RIEPILOGO ROW ── */
function RRow({label,value,sub,bold}) {
  return (
    <div style={{display:"flex",justifyContent:"space-between",padding:"5px 0"}}>
      <div>
        <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:12,color:bold?"#D0D0D0":"#A0A0A0",fontWeight:bold?700:400}}>{label}</span>
        {sub&&<div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:10,color:"#6B6B6B",marginTop:2}}>{sub}</div>}
      </div>
      <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:bold?14:12,fontWeight:bold?800:500,color:bold?"#FFFFFF":"#D0D0D0"}}>{value}</span>
    </div>
  );
}

/* ── DOC PREVIEW (schermo) ── */
function DocPreview({doc,company}) {
  function f(n){return(Number(n)||0).toLocaleString("it-IT",{style:"currency",currency:"EUR"});}
  return (
    <div style={{background:"#fff",color:"#111",padding:"28px 24px",borderRadius:12,boxShadow:"0 1px 4px rgba(0,0,0,0.1)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",borderBottom:"2.5px solid #1B6EF3",paddingBottom:14,marginBottom:18}}>
        <div style={{display:"flex",flexDirection:"column",gap:4}}>
          <LogoSVG dark/>
          <div style={{fontSize:10,color:"#666",marginTop:1}}>{company.sottotitolo}</div>
        </div>
        <div style={{textAlign:"right",fontSize:10,color:"#555",lineHeight:1.7}}>
          {company.indirizzo&&<div>{company.indirizzo}</div>}

          {company.email&&<div>{company.email}</div>}

          <div style={{fontSize:22,fontWeight:900,color:"#111",letterSpacing:"-0.5px"}}>PREVENTIVO</div>
          <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:11,color:"#888",marginTop:3}}>N° {doc.numero} · {doc.data}</div>
        </div>
        <div style={{textAlign:"right",fontSize:12,color:"#111"}}>
          <div style={{fontWeight:700,fontSize:13}}>{doc.cliente}</div>
          {doc.telefono&&<div style={{color:"#555"}}>{doc.telefono}</div>}
          {doc.indirizzo&&<div style={{color:"#555"}}>{doc.indirizzo}</div>}
        </div>
      </div>
      <PSec>Lavoro svolto</PSec>
      <div style={{fontSize:13,color:"#333",whiteSpace:"pre-wrap",marginBottom:16,lineHeight:1.6}}>{doc.lavoro}</div>
      <PSec>Dettaglio costi</PSec>
      <table style={{width:"100%",fontSize:13,borderCollapse:"collapse",marginBottom:6}}>
        <tbody>
          <tr style={{borderBottom:"1px solid #f0f0f0"}}>
            <td style={{padding:"6px 0",color:"#333"}}>Manodopera ({doc.ore} h × {doc.persone||1} pers. × {f(doc.tariffaOraria)})</td>
            <td style={{padding:"6px 0",textAlign:"right",fontWeight:600,color:"#111"}}>{f(doc.subtotaleManodopera)}</td>
          </tr>
          {(doc.materiali||[]).map(m=>(
            <tr key={m.id} style={{borderBottom:"1px solid #f5f5f5"}}>
              <td style={{padding:"5px 0",color:"#666"}}>{m.desc||"—"} <span style={{color:"#999"}}>({m.quantita} {m.unita} × {f(m.prezzoUnitario)})</span></td>
              <td style={{padding:"5px 0",textAlign:"right",color:"#555"}}>{f(m.totaleRiga)}</td>
            </tr>
          ))}
          <tr style={{borderTop:"1.5px solid #ddd"}}>
            <td style={{padding:"8px 0",fontWeight:700,color:"#111"}}>Totale lordo</td>
            <td style={{padding:"8px 0",textAlign:"right",fontWeight:700,color:"#111"}}>{f(doc.totaleLordo)}</td>
          </tr>
          {doc.scontoValoreCalc>0&&(
            <tr><td style={{padding:"5px 0",color:"#c00"}}>Sconto {doc.scontoTipo==="percentuale"?`(${doc.scontoValore}%)`:"fisso"}</td><td style={{padding:"5px 0",textAlign:"right",color:"#c00"}}>− {f(doc.scontoValoreCalc)}</td></tr>
          )}
        </tbody>
      </table>
      <div style={{background:"#1B6EF3",color:"#fff",borderRadius:7,padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",margin:"14px 0 20px"}}>
        <span style={{fontWeight:700,fontSize:13}}>TOTALE PREVENTIVO</span>
        <span style={{fontWeight:900,fontSize:22,letterSpacing:"-0.5px"}}>{f(doc.totaleNetto)}</span>
      </div>
      {doc.note&&<React.Fragment><PSec>Note</PSec><div style={{fontSize:12,color:"#555",whiteSpace:"pre-wrap",marginBottom:18,lineHeight:1.65}}>{doc.note}</div></React.Fragment>}
      <div style={{fontSize:10,color:"#999",borderTop:"1px solid #eee",paddingTop:10,lineHeight:1.65}}>
        Il presente preventivo ha validità 30 giorni dalla data di emissione, salvo diverso accordo scritto tra le parti. I prezzi si intendono IVA esclusa, salvo diversa indicazione. Offerta soggetta a sopralluogo.

      <div style={{display:"flex",justifyContent:"space-around",gap:30,marginTop:36}}>
